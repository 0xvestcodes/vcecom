name: Generate OpenAPI JSON

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/backend/**'
      - 'apps/docs/**'
      - '.github/workflows/generate-openapi.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  workflow_call: # Allow calling from other workflows

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build-info.ts
        run: pnpm --filter @vestcodes/vcecom-backend run generate-build-info

      - name: Build backend
        run: pnpm --filter @vestcodes/vcecom-backend build
        env:
          NODE_ENV: production

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          postgresql-version: '15'
          postgresql-db: 'vcecom_test'

      - name: Setup Redis
        uses: supercharge/redis-github-action@v1.8.1
        with:
          redis-version: '7'

      - name: Start backend server
        run: |
          cd apps/backend
          PORT=3001 node dist/main.js &
          echo $! > backend.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vcecom_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: production
          PORT: 3001

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -f http://localhost:3001/_health/database > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Attempt $i: Backend not ready yet, waiting..."
            sleep 2
          done
          echo "Backend failed to start within 60 seconds"
          exit 1

      - name: Fetch OpenAPI JSON
        run: |
          mkdir -p apps/docs/static/api-docs
          curl -f http://localhost:3001/api/docs-json -o apps/docs/static/api-docs/openapi.json
          echo "OpenAPI JSON saved successfully"
          # Verify JSON is valid
          cat apps/docs/static/api-docs/openapi.json | jq . > /dev/null
          echo "File size: $(wc -c < apps/docs/static/api-docs/openapi.json) bytes"

      - name: Save OpenAPI JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: apps/docs/static/api-docs/openapi.json
          retention-days: 1

      - name: Stop backend server
        if: always()
        run: |
          if [ -f apps/backend/backend.pid ]; then
            kill $(cat apps/backend/backend.pid) || true
            rm apps/backend/backend.pid || true
          fi

