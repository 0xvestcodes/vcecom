name: Deploy Documentation

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/docs/**'
      - 'apps/backend/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/generate-openapi.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-openapi:
    uses: ./.github/workflows/generate-openapi.yml

  build:
    needs: generate-openapi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenAPI JSON artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-json
          path: apps/docs/static/api-docs/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI JSON exists
        run: |
          if [ ! -f apps/docs/static/api-docs/openapi.json ]; then
            echo "Error: OpenAPI JSON not found. Make sure generate-openapi workflow ran successfully."
            exit 1
          fi
          echo "OpenAPI JSON found: $(wc -l < apps/docs/static/api-docs/openapi.json) lines"

      - name: Build documentation
        run: pnpm --filter=@vestcodes/vcecom-docs build
        env:
          NODE_ENV: production

      - name: Copy docs to root docs folder
        run: |
          mkdir -p docs
          cp -r apps/docs/build/* docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

