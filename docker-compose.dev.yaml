services:
  postgres:
    image: postgres:16-alpine
    container_name: vcecom-postgres-dev
    environment:
      POSTGRES_USER: vcecom
      POSTGRES_PASSWORD: vcecom_dev_password
      POSTGRES_DB: vcecom_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcecom"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcecom-network

  redis:
    image: redis:7-alpine
    container_name: vcecom-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcecom-network

  minio:
    image: minio/minio:latest
    container_name: vcecom-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vcecom-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: vcecom-zipkin-dev
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vcecom-network

  prometheus:
    image: prom/prometheus:latest
    container_name: vcecom-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./apps/backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./apps/backend/monitoring/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    # For Linux hosts, uncomment extra_hosts to access host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vcecom-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:

networks:
  vcecom-network:
    driver: bridge

